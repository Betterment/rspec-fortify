inherit_gem:
  betterlint:
    - config/default.yml

inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.0
  Exclude:
    - 'gemfiles/*.gemfile'
    - 'Rakefile'
  NewCops: enable

Capybara/RSpec/PredicateMatcher:
  Enabled: false

Betterment/EnvironmentConfiguration:
  Enabled: false

# Fixtures are run by name from other specs, so they intentionally don't end
# in _spec.rb (which keeps the normal spec run from picking them up).
RSpec/SpecFilePathSuffix:
  Exclude:
    - 'spec/fixtures/**/*'

Style/OneClassPerFile:
  Exclude:
    - 'lib/rspec_ext/rspec_ext.rb'
